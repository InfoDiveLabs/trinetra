name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  build:
    runs-on: ubuntu-latest
    environment: release
    steps:
      # Reject the run before anything else executes (build, signing, etc.)
      # if the tag isn't a plain semver "vX.Y.Z(-pre)" (review M2/controller
      # R12). The tag reaches the shell only through the TAG env var, never
      # spliced inline into the script, so a ref name containing shell
      # metacharacters can't be interpreted as anything but a literal string
      # here.
      - name: Validate tag format
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::invalid tag format: $TAG (want vX.Y.Z or vX.Y.Z-pre)"
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with: { go-version-file: go.mod }
      - run: go test -race -count=1 ./...
      - name: Build linux binaries
        run: |
          V="${GITHUB_REF_NAME}"
          make release-prod VERSION="$V"
      - name: Check embedded release keys
        run: bash scripts/release-check-keys.sh dist/trinetra-linux-amd64
      - name: Manifest and CI signature
        env:
          TRINETRA_SIGNING_KEY: ${{ secrets.TRINETRA_CI_SIGNING_KEY }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          CH=stable; case "$V" in *-*) CH=beta;; esac
          # --keys-from-binary: manifest.keys = the production key set compiled
          # into trinetra-release from this same commit, which the previous
          # step already proved equals the key set in the built binary. The
          # maintainer's cosign then shows "keys: unchanged" unless this
          # release really rotates keys.
          go run ./cmd/trinetra-release manifest --dir dist --version "$V" --channel "$CH" \
            --min-upgrade-from "$(cat .release/min-upgrade-from)" --published "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --keys-from-binary
          go run ./cmd/trinetra-release sign --role ci --in dist/manifest.json --out dist/manifest.ci.sig
      - uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1.4.4
        with:
          subject-path: "dist/trinetra*-linux-*"
      - name: Draft release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          PRE=""; case "$GITHUB_REF_NAME" in *-*) PRE="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" --draft $PRE --title "$GITHUB_REF_NAME" --notes "Awaiting maintainer co-signature." \
            dist/trinetra*-linux-* dist/manifest.json dist/manifest.ci.sig dist/checksums.txt
