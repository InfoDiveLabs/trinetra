name: channels
on:
  schedule: [{ cron: "17 3 * * 1" }]
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pointers:
    runs-on: ubuntu-latest
    environment: channels
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod }
      - name: Sign channel pointers
        env:
          GH_TOKEN: ${{ github.token }}
          TRINETRA_SIGNING_KEY: ${{ secrets.TRINETRA_POINTER_SIGNING_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ch
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          # `gh api .../releases` (not `gh release list`) because it's the
          # only projection that reports each release's assets, which lets
          # trinetra-release latest require a signed manifest and refuse to
          # pick a release that has none (review B1). It orders by creation
          # date, not version, so the highest version is picked in Go
          # (trinetra-release latest) using update.ParseVersion/
          # CompareVersions ordering, not `[0]` off this list (review F2/I2).
          # --paginate combines every page into one JSON array. One release
          # listing is reused for both channels.
          RELEASES=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate)
          STABLE=$(echo "$RELEASES" | go run ./cmd/trinetra-release latest --channel stable)
          BETA=$(echo "$RELEASES" | go run ./cmd/trinetra-release latest --channel beta)
          for pair in "stable:$STABLE" "beta:$BETA"; do
            ch=${pair%%:*}; v=${pair#*:}
            [ -n "$v" ] || continue
            go run ./cmd/trinetra-release pointer --channel "$ch" --version "$v" --issued "$NOW" --out "ch/$ch.json"
            go run ./cmd/trinetra-release sign --role pointer --in "ch/$ch.json" --out "ch/$ch.json.sig"
          done
          gh release view channels >/dev/null 2>&1 || gh release create channels --title channels --notes "Signed channel pointers." --latest=false
          gh release upload channels ch/* --clobber
