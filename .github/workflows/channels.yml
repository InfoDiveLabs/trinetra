name: channels
on:
  schedule: [{ cron: "17 3 * * 1" }]
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pointers:
    runs-on: ubuntu-latest
    environment: channels
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: Sign channel pointers
        env:
          GH_TOKEN: ${{ github.token }}
          TRINETRA_SIGNING_KEY: ${{ secrets.TRINETRA_POINTER_SIGNING_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ch
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          STABLE=$(gh release list --exclude-drafts --exclude-pre-releases --limit 50 --json tagName -q '[.[] | select(.tagName|startswith("v"))][0].tagName')
          BETA=$(gh release list --exclude-drafts --limit 50 --json tagName -q '[.[] | select(.tagName|startswith("v"))][0].tagName')
          for pair in "stable:$STABLE" "beta:$BETA"; do
            ch=${pair%%:*}; v=${pair#*:}; v=${v#v}
            [ -n "$v" ] || continue
            go run ./cmd/trinetra-release pointer --channel "$ch" --version "$v" --issued "$NOW" --out "ch/$ch.json"
            go run ./cmd/trinetra-release sign --role pointer --in "ch/$ch.json" --out "ch/$ch.json.sig"
          done
          gh release view channels >/dev/null 2>&1 || gh release create channels --title channels --notes "Signed channel pointers." --latest=false
          gh release upload channels ch/* --clobber
