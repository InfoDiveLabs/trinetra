# Multi-host fleet topology for run.sh: one master, two children, one solo
# host and the mock Telegram API, each its own container. fleetnet is the
# master<->child link that run.sh partitions; tgnet stands in for a child's
# own internet path to Telegram, which a real partition from the master does
# not cut, so a child's local-fallback delivery can still reach mocktg.
# Daemons are started by run.sh (docker compose exec -d), not by systemd.
name: swfleet

x-sw: &sw
  build:
    context: ../../..
    dockerfile: test/docker/Dockerfile
  image: swfleet-e2e:latest
  command: ["sleep", "infinity"]
  init: true
  networks: [fleetnet]
  environment:
    RUNTIME_DIRECTORY: /run/trinetra
    TELEGRAM_BASE_URL: "http://mocktg:8080"

services:
  mocktg:
    <<: *sw
    hostname: mocktg
    networks: [fleetnet, tgnet]
    command: ["mocktg"]
    environment:
      ADDR: ":8080"
  master:
    <<: *sw
    hostname: master
  child1:
    <<: *sw
    hostname: child1
    networks: [fleetnet, tgnet]
  child2:
    <<: *sw
    hostname: child2
    networks: [fleetnet, tgnet]
  solo:
    <<: *sw
    hostname: solo

networks:
  fleetnet:
    name: swfleet_fleetnet
  tgnet:
    name: swfleet_tgnet
