{{define "content"}}
<div class="center"><div class="card">
  <div class="logo"><span class="lamp"></span><b>trinetra</b></div>
  <h2>Create your passkey</h2>
  <p class="sub" id="enrollStatus">Choose a name, then create a passkey on this device.</p>
  <label class="field"><span class="lb">Your name</span><input type="text" id="enrollName" value="on-call"></label>
  <input type="hidden" id="enrollToken" value="{{.EnrollToken}}">
  <button class="btn primary" id="enrollBtn" style="width:100%;justify-content:center;padding:12px">Create passkey</button>
  <p class="note" style="text-align:center;margin-top:16px">Your device makes a key bound to this site. Only the public half is stored.</p>
</div></div>
{{end}}
